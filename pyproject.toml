[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chakrashield"
version = "1.0.0"
description = "In-line dynamic checkout intervenor & subgraph abuse sentinel for COD risk"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "scipy>=1.13", "lightgbm>=4.3",
  "onnx>=1.16", "onnxmltools>=1.12", "onnxruntime>=1.18",
  "fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27",
  "networkx>=3.3", "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
